name: Build and publish to GitHub Pages

# Builds the site from main and pushes it to the gh-pages branch, which GitHub Pages serves.
# First time in a new repository: Settings > Pages > "Deploy from a branch" > gh-pages, / (root).
#
# Own domain: add a repository variable CUSTOM_DOMAIN (Settings > Secrets and variables >
# Actions > Variables), e.g. southslopemontessori.com. The build then writes the CNAME file
# GitHub Pages needs and uses https://<domain> for canonical and share links. Without it,
# the site is published at https://<owner>.github.io/<repo>/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            BASE="https://$CUSTOM_DOMAIN"
          else
            BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          echo "Publishing for $BASE"
          npm run check
          SITE_BASE_URL="$BASE" npm run build
          npm run bundle
          # Pages reads the custom domain from this file; without it every publish would clear the domain.
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > dist/CNAME; fi
      - name: Publish to the gh-pages branch
        working-directory: dist
        run: |
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -q -m "Publish site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
